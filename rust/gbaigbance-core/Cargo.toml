[package]
name = "gbaigbance-core"
version = "0.1.0"
edition = "2021"
description = "Cœur Rust de Gbaigbance : stats, synchro, recherche, stock"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
