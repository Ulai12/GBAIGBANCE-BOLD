    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gbaigbance" />
    <meta name="application-name" content="Gbaigbance" />
    <script>
      (() => {
        let mode = 'system';
        try {
          const saved = localStorage.getItem('gba_theme');
          if (saved === 'dark' || saved === 'light' || saved === 'system') mode = saved;
        } catch {}
        const dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.dataset.themeMode = mode;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#08060D' : '#FFFFFF');
      })();
    </script>
    <meta name="description" content="Gbaigbance — La plateforme événementielle africaine premium. Découvrez, réservez et participez aux meilleurs événements au Togo, Bénin et en Afrique francophone." />
    <meta property="og:title" content="Gbaigbance — L'événementiel africain" />
    <meta property="og:description" content="Gbaigbance — La plateforme événementielle africaine premium. Découvrez, réservez et participez aux meilleurs événements au Togo, Bénin et en Afrique francophone." />
    <meta property="og:image" content="/pwa-512x512.png" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />

    <!-- Schema.org JSON-LD for AI Search & Agent Indexing -->

    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Gbaigbance",

      "applicationCategory": "EventTicketingApplication",

      "description": "Plateforme événementielle et billetterie digitale en Afrique de l'Ouest (Togo, Bénin, Côte d'Ivoire). Découverte d'événements, concerts, festivals et paiement Mobile Money.",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "XOF",
        "lowPrice": "0"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://gbaigbance-event.vercel.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <title>Gbaigbance — L'événementiel africain</title>
