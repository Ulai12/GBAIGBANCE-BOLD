<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gbaigbance" />
    <meta name="application-name" content="Gbaigbance" />
    <meta name="description" content="Gbaigbance — La plateforme événementielle africaine premium. Découvrez, réservez et participez aux meilleurs événements au Togo, Bénin et en Afrique francophone." />
    <meta property="og:title" content="Gbaigbance — L'événementiel africain" />
    <meta property="og:description" content="Gbaigbance — La plateforme événementielle africaine premium. Découvrez, réservez et participez aux meilleurs événements au Togo, Bénin et en Afrique francophone." />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Performance: DNS Prefetch & Preconnect for Critical External CDNs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />

    <!-- Performance: Preload Critical Local Brand Assets -->
    <link rel="preload" href="/icon.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/pwa-192x192.png" as="image" type="image/png" />

    <!-- Performance: Module Preload for Instant Application Boot -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="modulepreload" href="/src/App.tsx" />

    <!-- Performance: Preload Primary Font Stylesheet (Manrope) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />

    <!-- AI & LLM Discovery (llmstxt.org standard) -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM Structured Information" />

    <!-- Schema.org JSON-LD for AI Search & Agent Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Gbaigbance",
      "url": "https://gbaigbance-event.vercel.app",
      "applicationCategory": "EventTicketingApplication",
      "operatingSystem": "All",
      "description": "Plateforme événementielle et billetterie digitale en Afrique de l'Ouest (Togo, Bénin, Côte d'Ivoire). Découverte d'événements, concerts, festivals et paiement Mobile Money.",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "XOF",
        "lowPrice": "0"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://gbaigbance-event.vercel.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <title>Gbaigbance — L'événementiel africain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
