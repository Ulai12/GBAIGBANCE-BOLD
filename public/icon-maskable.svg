<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2" />
      <stop offset="50%" stop-color="#6600FF" />
      <stop offset="100%" stop-color="#4A00B8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Subtle African Geometric Horizon Accent within safe zone -->
  <path d="M80 400 L136 344 L192 400 L256 344 L320 400 L376 344 L432 400" stroke="white" stroke-width="4" stroke-opacity="0.12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scaled slightly down to 85% to ensure full safe-zone compliance -->
  <g transform="translate(256, 256) scale(0.85)" filter="url(#shadow)">
    <!-- Dynamic Outer Soundwave Arc -->
    <path d="M -90 -45 A 110 110 0 1 1 -35 110" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Inner Bold Crest Forming the 'G' -->
    <path d="M 50 -105 A 115 115 0 1 0 115 10 L 0 10" fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pulse Core / Spark -->
    <circle cx="0" cy="10" r="14" fill="url(#accent)" />

    <!-- Sparkling Festival Star Accent -->
    <path d="M 65 -75 Q 85 -75 85 -95 Q 85 -75 105 -75 Q 85 -75 85 -55 Q 85 -75 65 -75 Z" fill="#FFD54F" />
  </g>
</svg>
